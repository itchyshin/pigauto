reference:
  - title: "One-call entry point"
    desc: >
      The main user-facing function. Runs the full pipeline
      (`preprocess_traits` → `build_phylo_graph` → `fit_baseline` →
      `fit_pigauto` → `predict` → `evaluate`) and returns a completed
      data frame.
    contents:
      - impute

  - title: "Experimental analysis-aware MI for fixed effects"
    desc: >
      The analysis model is declared before imputations are drawn. Initial
      support is one incomplete continuous covariate under MAR with lm,
      binomial-logit glm, or one-random-intercept lmer. Fixed effects only;
      the backend passed its package-level fixed-effect gate and remains an
      experimental, deliberately narrow interface.
    contents:
      - multi_impute_analysis
      - with_imputations
      - pool_mi

  - title: "Stochastic prediction diagnostics"
    desc: >
      Conformal-width, Brownian/MC-dropout, PMM, and posterior-tree draws.
      These paths failed or were outside the downstream inferential gate and
      must not be used as analysis-aware multiple imputations.
    contents:
      - multi_impute
      - multi_impute_trees

  - title: "Pipeline — fine-grained control"
    desc: >
      Individual steps of the `impute()` pipeline, exposed for
      benchmarking and custom workflows.
    contents:
      - preprocess_traits
      - build_phylo_graph
      - make_missing_splits
      - mask_missing
      - fit_baseline
      - fit_pigauto
      - predict.pigauto_fit
      - evaluate
      - evaluate_imputation

  - title: "Active imputation (sampling-design guidance)"
    desc: >
      Per-candidate-observation expected uncertainty reduction across
      every currently-missing cell, using closed-form BM
      (Sherman-Morrison) variance reduction for continuous / count /
      ordinal / proportion / zi_count magnitude and label-propagation
      entropy reduction for binary / categorical / zi_count gate.
    contents:
      - suggest_next_observation

  - title: "Covariate data helpers"
    desc: >
      Optional helpers for assembling environmental covariate matrices
      from public data sources. Both are designed to plug into
      `impute(..., covariates = X)`.
    contents:
      - pull_gbif_centroids
      - pull_worldclim_per_species

  - title: "Benchmarks and cross-validation"
    contents:
      - simulate_benchmark
      - simulate_non_bm
      - cross_validate
      - compare_methods

  - title: "Reporting and plotting"
    contents:
      - pigauto_report
      - plot.pigauto_fit
      - plot.pigauto_pred
      - plot.pigauto_benchmark
      - plot_comparison
      - plot_history_gg
      - plot_uncertainty
      - summary.pigauto_fit
      - calibration_df
      - confusion_matrix

  - title: "I/O helpers"
    contents:
      - read_traits
      - read_tree
      - save_pigauto
      - load_pigauto

  - title: "Bundled data"
    contents:
      - avonet300
      - tree300
      - trees300
      - avonet_full
      - tree_full
      - ctmax_sim
