    code_font: {google: "JetBrains Mono"}

home:
  logo: man/figures/logo.png
  title: "pigauto: Phylogenetic Imputation via Graph AUTO-encoders"
  description: >
    pigauto imputes missing trait data for comparative analyses by
    combining three sources of information: phylogenetic similarity
    (closely related species share similar traits), cross-trait
    correlations (observed traits inform missing ones), and optional
    environmental covariates (climate, habitat, geography). It handles
    eight trait types in a single call: continuous measurements,
    counts, binary variables, unordered categories, ordered categories,
    bounded proportions, zero-inflated counts, and compositional
    (multi-proportion) data that sums to one across components.
    Uncertainty is quantified via conformal prediction intervals and
    Rubin's-rules multiple imputation, with tree-uncertainty
    propagation via posterior tree samples. Tested up to 10,000
    species on a laptop.
  links:
    - text: Source code
      href: https://github.com/itchyshin/pigauto
    - text: Report a bug
      href: https://github.com/itchyshin/pigauto/issues

