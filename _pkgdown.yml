url: https://itchyshin.github.io/pigauto

# Build into _site/, not docs/: docs/ holds the tracked dev-log notes, and pkgdown refuses
# to write into a non-empty folder it did not create (check_dest_is_pkgdown), which failed
# every main build from at least 2026-09-19 to 2026-09-24.
destination: _site

template:
  bootstrap: 5
  bootswatch: flatly    # gives a coloured (bg-primary) navbar, matching drmTMB/symbolizer
  bslib:
    primary: "#2c5e4f"   # brand green; matches prepR4pcm/_pkgdown.yml
    base_font: {google: "Inter"}
    heading_font: {google: "Inter"}
    code_font: {google: "JetBrains Mono"}
  includes:
    after_body: |
      <script>
      (function () {
        document.querySelectorAll("blockquote p").forEach(function (p) {
          var html = p.innerHTML;
          var m = html.match(/^\[!(WARNING|NOTE|IMPORTANT|TIP|CAUTION)\]\s*/i);
          if (!m) return;
          p.innerHTML = html.replace(/^\[![A-Z]+\]\s*/i, "");
          var bq = p.closest("blockquote");
          if (bq) {
            bq.classList.add("pa-callout", "pa-callout-" + m[1].toLowerCase());
          }
        });
      })();
      </script>

home:
  logo: man/figures/logo.png
  title: "pigauto: Phylogenetic Imputation via Graph AUTO-encoders"
  sidebar:
    structure: [links, license, citation, authors, dev]
  description: >
    Fill missing values in species trait data using a phylogenetic tree,
    information from other traits, and optional environmental data. Supports
    continuous, count, binary, categorical, ordinal, proportion,
    zero-inflated count, and compositional traits in one workflow.
    Experimental: use at your own risk. CRAN availability is not scientific
    maturity; point estimates are the supported claim. Prediction-interval
    coverage is not certified, and covariance routes have focused-test
    evidence only.

navbar:
  structure:
    left:  [intro, articles, reference, news]
    right: [search, github]
  components:
    intro:
      text: Get started
      href: articles/getting-started.html
    articles:
      text: Articles
      menu:
        - text: "Knitted vignettes"
        - text: "Get started"
          href: articles/getting-started.html
        - text: "Common pitfalls / FAQ"
          href: articles/common-pitfalls.html
        - text: "Mixed-type traits"
          href: articles/mixed-types.html
        - text: "Multiple imputation and downstream models"
          href: articles/multiple-imputation.html
        - text: "Tree sensitivity (not inferentially validated)"
          href: articles/tree-uncertainty.html
        - text: "GNN architecture and the math behind pigauto"
          href: articles/gnn-architecture.html
        # Four static walk-through HTML pages (pigauto_intro,
        # pigauto_workflow_mixed, pigauto_walkthrough_covariates,
        # pigauto_walkthrough_multi_obs) were retired in 2026-05 to
        # dev/archive/ because their version badges, trait-type scope,
        # and comparator wording had gone stale.  Do not restore
        # them as live navbar entries.  If a fresh walk-through is
        # needed, write a new source-backed vignette under vignettes/
        # rather than reanimating the archived HTML.  Audit detail:
        # useful/pkgdown_page_rethink.md.
    # Dated static benchmark snapshots were retired from public navigation
    # for 0.11.0. Their unchanged source files are archived under
    # dev/archive/cran-011-public-pages/ with a hash manifest in
    # docs/dev-log/cran-0.11-audit/retirement-manifest.md.

reference:
  - title: "Start here"
    desc: >
      Read traits and a tree, inspect the fit-free input check, run the
      one-call imputation entry point, and extract completed data.
    contents:
      - read_traits
      - read_tree
      - check_pigauto
      - print.pigauto_check
      - impute
      - completed_data
      - plot.pigauto_result
      - summary.pigauto_result
      - print.summary_pigauto_result

  - title: "Downstream fitting and fixed-effect pooling"
    desc: >
      Pool posterior imputations from multi_impute() for their documented
      continuous-trait analyses, or use multi_impute_analysis() for one
      incomplete continuous covariate under MAR with lm, binomial-logit glm,
      or one-random-intercept lmer. Fixed effects only.
    contents:
      - multi_impute_analysis
      - with_imputations
      - pool_mi

  - title: "Multiple imputation and prediction sensitivity"
    desc: >
      The default multi_impute() route selects posterior draws for eligible
      continuous-trait input. Conformal, MC-dropout, PMM, and posterior-tree
      draws remain prediction diagnostics and cannot enter Rubin pooling.
    contents:
      - multi_impute
      - multi_impute_trees

  - title: "Pipeline — fine-grained control"
    desc: >
      Individual steps of the `impute()` pipeline, exposed for
      benchmarking and custom workflows.
    contents:
      - preprocess_traits
      - build_phylo_graph
      - make_missing_splits
      - mask_missing
      - fit_baseline
      - fit_pigauto
      - predict.pigauto_fit
      - evaluate
      - evaluate_imputation

  - title: "Active imputation (model-based ranking)"
    desc: >
      Model-based BM/label-propagation proxy rankings under their stated
      assumptions. They are not a demonstrated field-gain or an optimal
      sampling guarantee.
    contents:
      - suggest_next_observation

  - title: "Covariate data helpers"
    desc: >
      Optional helpers for assembling environmental covariate matrices
      from public data sources. Both are designed to plug into
      `impute(..., covariates = X)`.
    contents:
      - pull_gbif_centroids
      - pull_worldclim_per_species

  - title: "Benchmarks and cross-validation"
    contents:
      - simulate_benchmark
      - simulate_non_bm
      - cross_validate
      - compare_methods

  - title: "Reporting and plotting"
    contents:
      - pigauto_report
      - plot.pigauto_fit
      - plot.pigauto_pred
      - plot.pigauto_result
      - plot.pigauto_benchmark
      - plot_comparison
      - plot_history_gg
      - plot_uncertainty
      - summary.pigauto_fit
      - calibration_df
      - confusion_matrix

  - title: "I/O helpers"
    contents:
      - save_pigauto
      - load_pigauto

  - title: "Bundled data"
    contents:
      - avonet300
      - tree300
      - trees300
      - avonet_full
      - tree_full
      - ctmax_sim
