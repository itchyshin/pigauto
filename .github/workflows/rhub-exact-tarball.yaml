name: R-hub exact CRAN archive

on:
  workflow_dispatch:
    inputs:
      release_asset_id:
        description: Numeric asset ID of the frozen pigauto_0.11.1.tar.gz in this repository
        required: true
        type: string

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      containers: ${{ steps.rhub.outputs.containers }}
    steps:
      - id: rhub
        uses: r-hub/actions/setup@02be5ffbeae2b0d553da66acded089da11a1fb8f # v1
        with:
          config: '{"platforms":["ubuntu-release","ubuntu-clang"]}'

  exact-archive:
    needs: setup
    if: ${{ needs.setup.outputs.containers != '[]' }}
    runs-on: ubuntu-latest
    name: ${{ matrix.config.label }} exact archive
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.setup.outputs.containers) }}
    container:
      image: ${{ matrix.config.container }}
    env:
      EXPECTED_SHA256: e4596a58ac2495de59d48d1a0b18e878156544a7d7eab4684be9bbf1339f48ad
      EXPECTED_SIZE: '5434793'
      ARCHIVE: /tmp/pigauto_0.11.1.tar.gz
      _R_CHECK_FORCE_SUGGESTS_: 'true'
      _R_CHECK_LIMIT_CORES_: 'true'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - name: Download and verify the frozen archive
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_ID: ${{ inputs.release_asset_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ASSET_ID" =~ ^[0-9]+$ ]]
          mkdir -p evidence
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/octet-stream' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID" \
            -o "$ARCHIVE"
          test "$(wc -c < "$ARCHIVE" | tr -d ' ')" = "$EXPECTED_SIZE"
          printf '%s  %s\n' "$EXPECTED_SHA256" "$ARCHIVE" | sha256sum --check
          sha256sum "$ARCHIVE" | tee evidence/sha256-before.txt
          tar -tzf "$ARCHIVE" > evidence/inventory.txt
          tar -xzf "$ARCHIVE" -C "$GITHUB_WORKSPACE" --strip-components=1
      - uses: r-hub/actions/platform-info@02be5ffbeae2b0d553da66acded089da11a1fb8f # v1
        with:
          job-config: ${{ matrix.config.job-config }}
      - uses: r-hub/actions/setup-deps@02be5ffbeae2b0d553da66acded089da11a1fb8f # v1
        with:
          job-config: ${{ matrix.config.job-config }}
      - name: Check the original archive
        uses: r-hub/actions/run-check@02be5ffbeae2b0d553da66acded089da11a1fb8f # v1
        with:
          job-config: ${{ matrix.config.job-config }}
        env:
          RHUB_ACTIONS_CHECK_SCRIPT: >-
            set -euo pipefail;
            mkdir -p "$GITHUB_WORKSPACE/check";
            R CMD check --as-cran --run-donttest --output="$GITHUB_WORKSPACE/check" "$ARCHIVE" 2>&1 | tee "$GITHUB_WORKSPACE/evidence/check.log";
            test -f "$GITHUB_WORKSPACE/check/pigauto.Rcheck/00check.log";
            grep -q '^Status: OK' "$GITHUB_WORKSPACE/check/pigauto.Rcheck/00check.log"
      - name: Verify archive after checking
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          test -f "$ARCHIVE"
          test "$(wc -c < "$ARCHIVE" | tr -d ' ')" = "$EXPECTED_SIZE"
          printf '%s  %s\n' "$EXPECTED_SHA256" "$ARCHIVE" | sha256sum --check
          sha256sum "$ARCHIVE" | tee evidence/sha256-after.txt
      - name: Retain check evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rhub-exact-${{ matrix.config.label }}
          path: |
            evidence/
            check/
          if-no-files-found: error
          retention-days: 30
