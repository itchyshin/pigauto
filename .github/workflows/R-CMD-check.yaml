on:
  push:
    branches: [main, master]
    paths:
      - 'R/**'
      - 'tests/**'
      - 'vignettes/**'
      - 'man/**'
      - 'README.md'
      - 'NEWS.md'
      - 'DESCRIPTION'
      - 'NAMESPACE'
      - '.github/workflows/R-CMD-check.yaml'
  pull_request:
    # Mirror the push filter above. Without this, a one-line docs PR ran the FULL
    # matrix -- two ubuntu legs plus macOS, which bills at 10x the Linux rate
    # (observed on #178, a single-character change to AGENTS.md). `push` has been
    # filtered since this workflow was written; `pull_request` was simply missed.
    # main is not branch-protected and these checks are not required, so a skipped
    # run cannot block a merge -- verified before adding this.
    paths:
      - 'R/**'
      - 'tests/**'
      - 'vignettes/**'
      - 'man/**'
      - 'README.md'
      - 'NEWS.md'
      - 'DESCRIPTION'
      - 'NAMESPACE'
      - '.github/workflows/R-CMD-check.yaml'
  workflow_dispatch:

name: R-CMD-check

permissions:
  contents: read

concurrency:
  group: R-CMD-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: 'release'}
          - {os: ubuntu-latest, r: 'devel'}
          - {os: macos-latest, r: 'release'}

    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 75

    name: ${{ matrix.config.os }} (R ${{ matrix.config.r }})

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_FORCE_SUGGESTS_: false
      # Auto-install the libtorch backend non-interactively when torch is
      # first loaded (fallback if the explicit install step below is skipped).
      TORCH_INSTALL: 1

    steps:
      - uses: actions/checkout@v6

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ghostscript \
            libgdal-dev \
            libgeos-dev \
            libglpk40 \
            libglpk-dev \
            libproj-dev \
            qpdf

      - name: Install macOS system dependencies
        if: runner.os == 'macOS'
        run: brew install gdal geos ghostscript glpk proj qpdf

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: ${{ runner.os == 'Linux' }}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::rcmdcheck
            any::testthat
            any::knitr
            any::rmarkdown
            any::rgbif
            any::terra

      # torch is a hard dependency, but the R package alone is not enough:
      # the libtorch/lantern C++ backend must be downloaded, or every test
      # that touches a tensor errors instead of running. Install it explicitly
      # so torch::torch_is_installed() is TRUE for the check's test processes.
      - name: Install libtorch backend
        run: Rscript -e 'torch::install_torch()'

      # Catch ARM/MPS state-restoration regressions before the much longer
      # full package check.  This file contains the direct covariate-bias
      # canary that previously failed only on GitHub's macOS runner.
      - name: Run focused MPS prediction tests
        if: runner.os == 'macOS'
        run: Rscript -e 'testthat::test_local(filter = "fit-predict|new-features")'

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual", "--compact-vignettes=gs+qpdf")'
          args: 'c("--no-manual")'
