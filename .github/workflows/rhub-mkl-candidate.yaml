name: R-hub threaded MKL frozen candidate
on:
  push:
    branches: [codex/rhub-mkl-thread4-5da2]
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      image: ${{ steps.pin.outputs.image }}
    steps:
      - id: pin
        shell: bash
        run: |
          set -euo pipefail
          docker pull ghcr.io/r-hub/containers/mkl:latest
          image=$(docker image inspect --format '{{index .RepoDigests 0}}' ghcr.io/r-hub/containers/mkl:latest)
          echo "image=$image" | tee -a "$GITHUB_OUTPUT"
  focused:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: ${{ needs.image.outputs.image }}
    env:
      MKL_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '4'
      MKL_DYNAMIC: 'FALSE'
      NOT_CRAN: 'false'
      R_COMPILE_AND_INSTALL_PACKAGES: 'always'
    steps:
      - name: Switch disposable R to threaded MKL
        shell: bash
        run: |
          set -euo pipefail
          dnf install -y patchelf
          RHOME=$(R RHOME)
          target="$RHOME/lib/libR.so"
          patchelf --print-needed "$target" | grep -Fx libmkl_sequential.so.2
          test -f /opt/intel/oneapi/mkl/2025.3/lib/libmkl_gnu_thread.so.2
          patchelf --replace-needed libmkl_sequential.so.2 libmkl_gnu_thread.so.2 "$target"
          patchelf --print-needed "$target" | grep -Fx libmkl_gnu_thread.so.2
          ldd "$target" | grep -F libmkl_gnu_thread.so.2
          if ldd "$target" | grep -F libmkl_sequential.so.2; then exit 1; fi
      - name: Verify input and identify environment
        shell: bash
        env:
          IMAGE: ${{ needs.image.outputs.image }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          printf 'image=%s\nMKL_NUM_THREADS=%s\nOPENBLAS_NUM_THREADS=%s\nOMP_NUM_THREADS=%s\n' "$IMAGE" "$MKL_NUM_THREADS" "$OPENBLAS_NUM_THREADS" "$OMP_NUM_THREADS" | tee evidence/environment.txt
          uname -a | tee -a evidence/environment.txt
          cat /etc/os-release | tee -a evidence/environment.txt
          cat /proc/cpuinfo | grep -m1 'model name' | tee -a evidence/environment.txt
          Rscript --vanilla -e 'print(sessionInfo()); print(extSoftVersion()); print(R.version)' | tee -a evidence/environment.txt
          RHOME=$(R RHOME)
          ls -l "$RHOME/lib/libRblas.so" "$RHOME/lib/libRlapack.so" | tee -a evidence/environment.txt
          ldd "$RHOME/lib/libRblas.so" | tee -a evidence/environment.txt
          ldd "$RHOME/lib/libR.so" | tee -a evidence/environment.txt
          Rscript --vanilla -e 'stopifnot(grepl("mkl", extSoftVersion()[["BLAS"]], ignore.case=TRUE))'
          MKL_VERBOSE=1 Rscript --vanilla -e 'set.seed(1); x <- matrix(rnorm(2000L * 2000L), 2000L); for (i in 1:8) invisible(x %*% x)' > evidence/mkl-thread-check.txt 2>&1 &
          pid=$!
          max_threads=0
          while kill -0 "$pid" 2>/dev/null; do
            if test -d "/proc/$pid/task"; then
              count=$(find "/proc/$pid/task" -mindepth 1 -maxdepth 1 -type d | wc -l)
              if (( count > max_threads )); then max_threads=$count; fi
            fi
            sleep 0.05
          done
          wait "$pid"
          cat evidence/mkl-thread-check.txt
          echo "max_R_process_threads=$max_threads" | tee -a evidence/mkl-thread-check.txt
          grep -E 'MKL_VERBOSE.*gnu_thread' evidence/mkl-thread-check.txt
          grep -E 'MKL_VERBOSE.*DGEMM' evidence/mkl-thread-check.txt
          test "$max_threads" -ge 4
          rpm -qa | grep -i mkl | tee -a evidence/environment.txt
          curl -fsSL https://raw.githubusercontent.com/itchyshin/pigauto/98f9a2c66cd4e6e3f4ba4daa6dfc41c986900cf1/rhub-payload/pigauto_0.11.1.tar.gz -o /tmp/pigauto_0.11.1.tar.gz
          echo '5da2b3c633ff3388f98abfed6cd5f6b15d1fa89807470c8debef5976757e4a78  /tmp/pigauto_0.11.1.tar.gz' | sha256sum -c - | tee evidence/hash.txt
          tar -xzf /tmp/pigauto_0.11.1.tar.gz
      - name: Install focused dependencies
        shell: bash
        run: |
          set -o pipefail
          Rscript --vanilla -e 'pak::pkg_install(c("any::torch", "any::ape", "any::ggplot2", "any::Matrix", "any::rlang", "any::withr", "any::testthat", "any::pkgload"), ask=FALSE)' 2>&1 | tee evidence/dependencies.log
      - name: Install candidate and run focused test
        shell: bash
        run: |
          set -o pipefail
          R CMD INSTALL /tmp/pigauto_0.11.1.tar.gz 2>&1 | tee evidence/install.log
          Rscript --vanilla -e 'testthat::test_local("pigauto", filter="mi-posterior", reporter="summary", stop_on_failure=TRUE)' 2>&1 | tee evidence/test.log
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rhub-mkl-thread4-focused-evidence
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
