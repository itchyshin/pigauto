name: CRAN gate (temporary)

on:
  push:
    branches:
      - codex/cran-gate-0100

permissions:
  contents: read

jobs:
  cran-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      _R_CHECK_FORCE_SUGGESTS_: true
      TORCH_INSTALL: 1

    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ghostscript \
            libgdal-dev \
            libgeos-dev \
            libglpk40 \
            libglpk-dev \
            libproj-dev \
            qpdf

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"all"'

      - name: Install libtorch backend
        run: Rscript -e 'torch::install_torch()'

      - name: Build and check the source tarball in CRAN mode
        run: |
          R CMD build .
          R CMD check --as-cran --run-donttest --no-manual pigauto_0.10.0.tar.gz
