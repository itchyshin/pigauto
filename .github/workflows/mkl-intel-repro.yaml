name: MKL Intel exact reproduction
on:
  push:
    branches: [codex/mkl-intel-repro-0111]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    container:
      image: ghcr.io/r-hub/containers/mkl@sha256:ba4d46e9409219837057a0de2965117a860476a2e713e2d3e619107ac251428b
    env:
      MKL_NUM_THREADS: '4'
      OMP_NUM_THREADS: '4'
      MKL_DYNAMIC: 'FALSE'
      NOT_CRAN: 'false'
      R_COMPILE_AND_INSTALL_PACKAGES: 'always'
    steps:
      - name: Record CPU and verify archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          grep -m1 'model name' /proc/cpuinfo | tee evidence/cpu.txt
          cat /etc/os-release > evidence/os.txt
          Rscript --vanilla -e 'print(sessionInfo()); print(extSoftVersion()); print(R.version)' > evidence/r.txt
          ldd "$(R RHOME)/lib/libR.so" > evidence/linkage.txt
          grep -qi 'intel' evidence/cpu.txt || { echo 'Not an Intel runner: no reproduction attempted.' | tee evidence/skipped.txt; exit 0; }
          touch evidence/intel.txt
          curl -fsSL https://cloud.r-project.org/src/contrib/pigauto_0.11.0.tar.gz -o /tmp/cran.tar.gz
          echo '5296214aca1905081748e6b8dec6facf227a38da6f2ca5a7020b94199bc324e2  /tmp/cran.tar.gz' | sha256sum -c - | tee evidence/hashes.txt
          curl -fsSL https://raw.githubusercontent.com/itchyshin/pigauto/98f9a2c66cd4e6e3f4ba4daa6dfc41c986900cf1/rhub-payload/pigauto_0.11.1.tar.gz -o /tmp/candidate.tar.gz
          echo '5da2b3c633ff3388f98abfed6cd5f6b15d1fa89807470c8debef5976757e4a78  /tmp/candidate.tar.gz' | sha256sum -c - | tee -a evidence/hashes.txt
          mkdir -p /tmp/v0110 /tmp/v0111
          tar -xzf /tmp/cran.tar.gz -C /tmp/v0110
          tar -xzf /tmp/candidate.tar.gz -C /tmp/v0111
      - name: Switch disposable R to threaded MKL
        shell: bash
        run: |
          test -f evidence/intel.txt || exit 0
          set -euo pipefail
          dnf install -y patchelf > evidence/patchelf.log 2>&1
          target="$(R RHOME)/lib/libR.so"
          patchelf --print-needed "$target" | grep -Fx libmkl_sequential.so.2
          patchelf --replace-needed libmkl_sequential.so.2 libmkl_gnu_thread.so.2 "$target"
          ldd "$target" | tee evidence/threaded-linkage.txt
          ldd "$target" | grep -F libmkl_gnu_thread.so.2
          MKL_VERBOSE=1 Rscript --vanilla -e 'set.seed(1); x <- matrix(rnorm(4000000),2000); invisible(x %*% x)' > evidence/mkl-verbose.txt 2>&1
      - name: Install focused dependencies
        shell: bash
        run: |
          test -f evidence/intel.txt || exit 0
          set -o pipefail
          Rscript --vanilla -e 'pak::pkg_install(c("any::torch", "any::ape", "any::ggplot2", "any::Matrix", "any::rlang", "any::withr", "any::testthat", "any::pkgload"), ask=FALSE)' 2>&1 | tee evidence/dependencies.log
      - name: Compare both versions repeatedly
        shell: bash
        run: |
          test -f evidence/intel.txt || exit 0
          set +e
          set -u
          failed=0
          for version in v0110 v0111; do
            for repeat in 1 2 3; do
              set -o pipefail
              Rscript --vanilla -e "testthat::test_local('/tmp/$version/pigauto', filter='mi-posterior', reporter='summary', stop_on_failure=TRUE)" > "evidence/${version}-${repeat}.log" 2>&1
              code=$?
              if [ "$code" -ne 0 ]; then failed=1; fi
              printf '%s %s exit=%s\n' "$version" "$repeat" "$code" | tee -a evidence/results.txt
            done
          done
          exit "$failed"
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mkl-intel-${{ matrix.attempt }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
