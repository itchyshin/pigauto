name: MKL full exact 0.11.2 archive
on:
  push:
    branches: [codex/pigauto-mkl-analysis-probe]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-check:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: ghcr.io/r-hub/containers/mkl@sha256:ba4d46e9409219837057a0de2965117a860476a2e713e2d3e619107ac251428b
    env:
      MKL_NUM_THREADS: '4'
      OMP_NUM_THREADS: '4'
      MKL_DYNAMIC: 'FALSE'
      _R_CHECK_FORCE_SUGGESTS_: 'true'
      _R_CHECK_LIMIT_CORES_: 'true'
      ARCHIVE: /tmp/pigauto_0.11.2.tar.gz
      EXPECTED_SHA256: 391bc6c2debbbfbc5b5c8f57a36481c9f3c805f48db421e27c30d0eb053e9b6f
    steps:
      - uses: actions/checkout@v4
      - name: Verify archive and prepare source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          cp rhub-payload/pigauto_0.11.2.tar.gz "$ARCHIVE"
          echo "$EXPECTED_SHA256  $ARCHIVE" | sha256sum -c - | tee evidence/hash-before.txt
          stat -c '%s' "$ARCHIVE" | tee evidence/size.txt
          tar -tzf "$ARCHIVE" > evidence/inventory.txt
          tar -xzf "$ARCHIVE" -C "$GITHUB_WORKSPACE" --strip-components=1
          grep -m1 'model name' /proc/cpuinfo | tee evidence/cpu.txt
          Rscript --vanilla -e 'print(sessionInfo()); print(extSoftVersion())' > evidence/r.txt
      - name: Enable threaded MKL
        shell: bash
        run: |
          set -euo pipefail
          dnf install -y patchelf > evidence/patchelf.log 2>&1
          target="$(R RHOME)/lib/libR.so"
          patchelf --print-needed "$target" | grep -Fx libmkl_sequential.so.2
          patchelf --replace-needed libmkl_sequential.so.2 libmkl_gnu_thread.so.2 "$target"
          ldd "$target" | tee evidence/linkage.txt
          ldd "$target" | grep -F libmkl_gnu_thread.so.2
          MKL_VERBOSE=1 Rscript --vanilla -e 'set.seed(1); x <- matrix(rnorm(4000000),2000); invisible(x %*% x)' > evidence/mkl-verbose.txt 2>&1
      - uses: r-hub/actions/setup-deps@02be5ffbeae2b0d553da66acded089da11a1fb8f
        with:
          extra-packages: any::rcmdcheck
      - name: Run full check on exact archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p check
          R CMD check --as-cran --run-donttest --no-stop-on-test-error --output="$GITHUB_WORKSPACE/check" "$ARCHIVE" 2>&1 | tee evidence/check.log
          test -f check/pigauto.Rcheck/00check.log
          grep -q '^Status: OK' check/pigauto.Rcheck/00check.log
      - name: Verify archive after check
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "$EXPECTED_SHA256  $ARCHIVE" | sha256sum -c - | tee evidence/hash-after.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mkl-full-0112-exact
          path: |
            evidence/
            check/
          if-no-files-found: error
          retention-days: 30
