name: MKL analysis MI diagnosis
on:
  push:
    branches: [codex/pigauto-mkl-analysis-probe]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    container:
      image: ghcr.io/r-hub/containers/mkl@sha256:ba4d46e9409219837057a0de2965117a860476a2e713e2d3e619107ac251428b
    env:
      MKL_NUM_THREADS: '4'
      OMP_NUM_THREADS: '4'
      MKL_DYNAMIC: 'FALSE'
      NOT_CRAN: 'false'
    steps:
      - uses: actions/checkout@v4
      - name: Set up threaded MKL
        shell: bash
        run: |
          set -euo pipefail
          mkdir evidence
          grep -m1 'model name' /proc/cpuinfo | tee evidence/cpu.txt
          Rscript --vanilla -e 'print(sessionInfo()); print(extSoftVersion())' > evidence/r.txt
          dnf install -y patchelf > evidence/patchelf.log 2>&1
          target="$(R RHOME)/lib/libR.so"
          patchelf --replace-needed libmkl_sequential.so.2 libmkl_gnu_thread.so.2 "$target"
          ldd "$target" | tee evidence/linkage.txt
          ldd "$target" | grep -F libmkl_gnu_thread.so.2
          MKL_VERBOSE=1 Rscript --vanilla -e 'set.seed(1); x <- matrix(rnorm(4000000),2000); invisible(x %*% x)' > evidence/mkl-verbose.txt 2>&1
      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          Rscript --vanilla -e 'pak::pkg_install(c("any::torch", "any::ape", "any::ggplot2", "any::Matrix", "any::rlang", "any::withr", "any::testthat", "any::pkgload"), ask=FALSE)' 2>&1 | tee evidence/dependencies.log
      - name: Investigate same-seed reproducibility
        shell: bash
        run: |
          set -o pipefail
          Rscript --vanilla script/mkl-analysis-probe.R 2>&1 | tee evidence/probe.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mkl-analysis-diagnosis
          path: evidence/
          retention-days: 30
